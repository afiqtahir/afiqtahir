<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0"/>
      <stop offset="15%" style="stop-color:#58a6ff;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#bc8cff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bc8cff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg{fill:url(#bgGrad)}
    .grid{stroke:#21262d;stroke-width:.5;opacity:.25}
    .title{fill:#f0f6fc;font:700 44px 'Segoe UI',system-ui,sans-serif;letter-spacing:-1px}
    .sub{fill:#58a6ff;font:600 20px 'Segoe UI',system-ui,sans-serif}
    .body{fill:#8b949e;font:400 17px 'Segoe UI',system-ui,sans-serif}
    .tag{fill:#161b22;stroke:#30363d;stroke-width:1;rx:6}
    .tag-text{fill:#8b949e;font:500 13px 'Segoe UI',system-ui,sans-serif}
    .panel{fill:#161b22;stroke:#30363d;stroke-width:1}
    .term{fill:#e6edf3;font:400 14px 'JetBrains Mono','Fira Code',monospace}
    .term-dim{fill:#484f58;font:400 14px 'JetBrains Mono','Fira Code',monospace}
    .term-green{fill:#3fb950;font:400 14px 'JetBrains Mono','Fira Code',monospace}
    .term-blue{fill:#58a6ff;font:400 14px 'JetBrains Mono','Fira Code',monospace}
    .cursor{fill:#58a6ff;opacity:.9}
    .cursor-blink{animation:blink 1.2s ease-in-out infinite}
    .dot-red{fill:#ff7b72}
    .dot-yellow{fill:#d29922}
    .dot-green{fill:#3fb950}
    @keyframes blink{0%,100%{opacity:.9}50%{opacity:0}}
  </style>

  <!-- Background -->
  <rect class="bg" width="1280" height="340"/>

  <!-- Subtle grid -->
  <g opacity=".3">
    <line class="grid" x1="0" y1="80" x2="1280" y2="80"/>
    <line class="grid" x1="0" y1="160" x2="1280" y2="160"/>
    <line class="grid" x1="0" y1="240" x2="1280" y2="240"/>
    <line class="grid" x1="0" y1="320" x2="1280" y2="320"/>
    <line class="grid" x1="200" y1="0" x2="200" y2="340"/>
    <line class="grid" x1="400" y1="0" x2="400" y2="340"/>
    <line class="grid" x1="600" y1="0" x2="600" y2="340"/>
    <line class="grid" x1="800" y1="0" x2="800" y2="340"/>
    <line class="grid" x1="1000" y1="0" x2="1000" y2="340"/>
    <line class="grid" x1="1200" y1="0" x2="1200" y2="340"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#accentLine)"/>

  <!-- Left content -->
  <text x="60" y="85" class="title">Afiq Tahir</text>
  <text x="60" y="118" class="sub">Web Developer · UI/UX Enthusiast</text>

  <text x="60" y="165" class="body">Crafting clean code and meaningful user experiences.</text>
  <text x="60" y="190" class="body">Turning ideas into modern web applications.</text>

  <!-- Tech tags -->
  <rect x="60" y="220" width="72" height="28" class="tag" rx="6"/>
  <text x="96" y="239" class="tag-text" text-anchor="middle">Laravel</text>

  <rect x="142" y="220" width="62" height="28" class="tag" rx="6"/>
  <text x="173" y="239" class="tag-text" text-anchor="middle">React</text>

  <rect x="214" y="220" width="92" height="28" class="tag" rx="6"/>
  <text x="260" y="239" class="tag-text" text-anchor="middle">TypeScript</text>

  <rect x="316" y="220" width="58" height="28" class="tag" rx="6"/>
  <text x="345" y="239" class="tag-text" text-anchor="middle">Linux</text>

  <rect x="384" y="220" width="76" height="28" class="tag" rx="6"/>
  <text x="422" y="239" class="tag-text" text-anchor="middle">Tailwind</text>

  <rect x="470" y="220" width="50" height="28" class="tag" rx="6"/>
  <text x="495" y="239" class="tag-text" text-anchor="middle">PHP</text>

  <!-- Status indicator -->
  <circle cx="72" y="290" r="4" fill="#3fb950" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="294" class="body" style="font-size:14px;fill:#8b949e">Available for collaboration</text>

  <!-- Terminal panel -->
  <rect x="720" y="35" width="500" height="270" rx="12" class="panel"/>

  <!-- Terminal header -->
  <rect x="720" y="35" width="500" height="36" rx="12" fill="#1c2128"/>
  <rect x="720" y="59" width="500" height="12" fill="#1c2128"/>
  <circle cx="745" cy="54" r="5.5" class="dot-red"/>
  <circle cx="765" cy="54" r="5.5" class="dot-yellow"/>
  <circle cx="785" cy="54" r="5.5" class="dot-green"/>
  <text x="970" y="58" class="term-dim" text-anchor="middle" style="font-size:12px">~/afiqtahir</text>

  <!-- Terminal content -->
  <text x="745" y="100" class="term-green">❯</text>
  <text x="765" y="100" class="term-blue">neofetch</text>

  <text x="745" y="130" class="term-dim">┌──────────────────────────┐</text>
  <text x="745" y="155" class="term-dim">│</text>
  <text x="765" y="155" class="term">OS</text>
  <text x="825" y="155" class="term-dim">→</text>
  <text x="845" y="155" class="term">Linux</text>
  <text x="1155" y="155" class="term-dim">│</text>

  <text x="745" y="180" class="term-dim">│</text>
  <text x="765" y="180" class="term">Editor</text>
  <text x="825" y="180" class="term-dim">→</text>
  <text x="845" y="180" class="term">VS Code</text>
  <text x="1155" y="180" class="term-dim">│</text>

  <text x="745" y="205" class="term-dim">│</text>
  <text x="765" y="205" class="term">Stack</text>
  <text x="825" y="205" class="term-dim">→</text>
  <text x="845" y="205" class="term">Laravel + React</text>
  <text x="1155" y="205" class="term-dim">│</text>

  <text x="745" y="230" class="term-dim">│</text>
  <text x="765" y="230" class="term">Focus</text>
  <text x="825" y="230" class="term-dim">→</text>
  <text x="845" y="230" class="term">Clean Code &amp; UI/UX</text>
  <text x="1155" y="230" class="term-dim">│</text>

  <text x="745" y="255" class="term-dim">└──────────────────────────┘</text>

  <text x="745" y="285" class="term-green">❯</text>
  <rect x="765" y="272" width="9" height="16" class="cursor cursor-blink" rx="1"/>
</svg>